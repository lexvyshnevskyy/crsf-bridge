; CRSF <-> CH9121 baud-rate bridge for STM32F103C6T6
; Same firmware on both ends of the Ethernet link.

[env:genericSTM32F103C6]
platform = ststm32
board = genericSTM32F103C6
framework = libopencm3
upload_protocol = stlink
debug_tool = stlink
build_flags =
  -DSTM32F1
  -Os
  -Wall
  -Wextra

; Aircraft-side board: SineLink slave UART1 is full-duplex CRSF at 416700.
[env:genericSTM32F103C6_rx]
extends = env:genericSTM32F103C6
build_flags =
  -DSTM32F1
  -DCRSF_BAUD=416700u
  -Os
  -Wall
  -Wextra

; Radio-side board only: half-duplex inverted CRSF on the TX12 module bay.
[env:genericSTM32F103C6_bay]
extends = env:genericSTM32F103C6
build_flags =
  -DSTM32F1
  -DCRSF_MODULE_BAY
  -DCRSF_BAUD=400000u
  -Os
  -Wall
  -Wextra

; ROM bootloader on USART1 (PA9 TX / PA10 RX). BOOT0 high, then reset.
[env:genericSTM32F103C6_serial]
extends = env:genericSTM32F103C6
upload_protocol = serial
upload_port = /dev/ttyUSB0
upload_speed = 115200

; Optional: Blue Pill / C8 boards (same pins, more flash)
[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = libopencm3
upload_protocol = stlink
debug_tool = stlink
build_flags =
  -DSTM32F1
  -Os
  -Wall
  -Wextra
